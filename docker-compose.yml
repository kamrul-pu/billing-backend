services:
  django-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-web
    env_file:
      - .env
    # depends_on:
    #   - db
    #   - redis

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app worker --loglevel=info
    depends_on:
      - django-web
    env_file:
      - .env
