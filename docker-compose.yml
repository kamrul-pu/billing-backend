services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing-backend-web
    command: /app/entrypoint.prod.sh
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    depends_on:
      - nginx

  nginx:
    image: nginx:latest
    container_name: billing-backend-nginx
    ports:
      - "8000:80"
    volumes:
      - static_volume:/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
