services:
  django-web:
    build: .
    container_name: django-web
    restart: always
    env_file:
      - .env
    command: ["/app/entrypoint.prod.sh"]
    volumes:
      - ./static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      # Add your DB here if needed
      # - db
      - celery-worker

  celery-worker:
    build: .
    container_name: celery-worker
    restart: always
    env_file:
      - .env
    command: celery -A app worker -l info
    depends_on:
      # Add your DB here if needed
      # - db
      - django-web
