  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./static:/static:ro
    depends_on:
      - django-web
    networks:
      - billing-network
    command: >
      sh -c "
      echo 'server {
        listen 80;
        location /static/ {
          alias /static/;
          expires 30d;
        }
        location /api/ {
          proxy_pass http://django-web:8000/api/;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
        location /admin/ {
          proxy_pass http://django-web:8000/admin/;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
        location / {
          proxy_pass http://django-web:8000;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
      }' > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "

networks:
  billing-network:
    driver: bridge
